<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Primary SEO Title -->
    <title>Chess Trainer – Learn Chess Openings, Tactics & Endgames</title>

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Meta Description (Very Important for SEO) -->
    <meta
      name="description"
      content="Improve your chess with interactive lessons, guided opening lines, tactical patterns, and endgame practice. Chess Trainer helps beginners and club players sharpen their skills through structured, hands-on training."
    />

    <!-- Keywords (Not as important as before, but still useful) -->
    <meta
      name="keywords"
      content="chess trainer, learn chess, chess openings, chess tactics, chess endgames, chess lessons, interactive chess training, chess improvement"
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="Chess Trainer – Learn Chess Openings, Tactics & Endgames" />
    <meta
      property="og:description"
      content="Sharpen your chess skills with structured, interactive training modules."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chesslearninghub.com" />
    <meta property="og:image" content="https://chesslearninghub.com/assets/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chess Trainer – Learn Chess Openings, Tactics & Endgames" />
    <meta
      name="twitter:description"
      content="Sharpen your chess skills with structured, interactive training modules."
    />
    <meta name="twitter:image" content="https://chesslearninghub.com/assets/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Chess Trainer",
        "url": "https://chesslearninghub.com",
        "logo": "https://chesslearninghub.com/assets/logo.png",
        "description": "Interactive chess training platform offering guided openings, tactics, and endgame lessons."
      }
    </script>

    <!-- Structured Data: Course (Openings Module) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "Chess Openings Training",
        "description": "Learn principled opening play with guided lines and interactive practice.",
        "provider": {
          "@type": "Organization",
          "name": "Chess Trainer",
          "url": "https://chesslearninghub.com"
        }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
