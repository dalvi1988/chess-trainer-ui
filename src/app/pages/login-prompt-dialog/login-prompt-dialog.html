<h2 mat-dialog-title>Save your progress?</h2>

<mat-dialog-content>
  <p>Log in to track your completed variations and continue your training across devices.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button (click)="continue()">Continue without saving</button>
  <button mat-button color="primary" (click)="login()">Log in</button>
</mat-dialog-actions>
